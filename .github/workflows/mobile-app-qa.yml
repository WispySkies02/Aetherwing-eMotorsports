name: Mobile app regression checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/admin/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/mobile-app-qa.yml'
  workflow_dispatch:

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Admin and mobile regression tests
        run: npm test
      - name: Validate site and build desktop plus mobile pages
        run: npm run build
