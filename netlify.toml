[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  included_files = ["data/paint-seed.json", "src/data/*.json"]

[[redirects]]
  from = "/api/site-content"
  to = "/.netlify/functions/site-data"
  status = 200

[[redirects]]
  from = "/api/paints"
  to = "/.netlify/functions/paint-data"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"


# Staging/debug safety: never let a phone browser pin an old Paint Booth HTML shell.
[[headers]]
  for = "/paint-booth/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
